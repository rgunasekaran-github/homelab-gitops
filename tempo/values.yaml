# Tempo config for k3s Homelab
# Monolithic mode for distributed tracing

replicas: 1

# Resources for Tempo pod
tempo:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Retention period
  retention: 168h

  # Storage configuration
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  # Enable metrics generator
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://prometheus-prometheus.prometheus.svc.cluster.local:9090/api/v1/write"
    storage:
      path: /var/tempo/metrics
    traces_storage:
      path: /var/tempo/wal

  # Receivers configuration (OTLP only)
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# Enable persistence
persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce

service:
  type: ClusterIP
