apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong-demo
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/rgunasekaran-github/homelab-gitops.git
    targetRevision: main
    path: kong-demo-apps
  
  destination:
    server: https://kubernetes.default.svc
    namespace: kong-demo-apps
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true