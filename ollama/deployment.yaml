apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: api
        volumeMounts:
        - name: ollama-pvc
          mountPath: /root/.ollama
      volumes:
      - name: ollama-pvc
        persistentVolumeClaim:
          claimName: ollama-pvc