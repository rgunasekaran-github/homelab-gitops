
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: grafana
spec:
  refreshInterval: 1h

  # Reference to your SecretStore (update with your actual store name)
  secretStoreRef:
    name: openbao-backend
    kind: SecretStore

  # Target secret to create
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: "{{ .username }}"
        admin-password: "{{ .password }}"

  # Data to fetch from OpenBao
  data:
    - secretKey: username
      remoteRef:
        key: grafana/admin  # Path in OpenBao
        property: username

    - secretKey: password
      remoteRef:
        key: grafana/admin  # Path in OpenBao
        property: password