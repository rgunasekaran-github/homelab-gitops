apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xteamidentityazure
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  compositeTypeRef:
    apiVersion: platform.homelab.io/v1alpha1
    kind: XTeamIdentityAzure
  resources:
    - name: user-assigned-identity
      base:
        apiVersion: managedidentity.azure.upbound.io/v1beta1
        kind: UserAssignedIdentity
        spec:
          forProvider:
            resourceGroupName: ""
            location: ""
          providerConfigRef:
            name: default-azure
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.resourceGroupName
          toFieldPath: spec.forProvider.resourceGroupName
        - type: FromCompositeFieldPath
          fromFieldPath: spec.location
          toFieldPath: spec.forProvider.location
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: metadata.annotations["crossplane.io/external-name"]
          transforms:
            - type: string
              string:
                type: Format
                fmt: "mi-%s"
        # Publish the Azure resource ID and principal ID back to composite status
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.id
          toFieldPath: status.userAssignedIdentityId
          policy:
            fromFieldPath: Optional
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.principalId
          toFieldPath: status.principalId
          policy:
            fromFieldPath: Optional

    - name: federated-identity-credential
      base:
        apiVersion: managedidentity.azure.upbound.io/v1beta1
        kind: FederatedIdentityCredential
        spec:
          forProvider:
            resourceGroupName: ""
            audience:
              - "api://AzureADTokenExchange"
            issuer: ""
            subject: ""
            parentId: ""
          providerConfigRef:
            name: default-azure
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.resourceGroupName
          toFieldPath: spec.forProvider.resourceGroupName
        - type: FromCompositeFieldPath
          fromFieldPath: spec.oidcIssuerUrl
          toFieldPath: spec.forProvider.issuer
        - type: CombineFromComposite
          combine:
            variables:
              - fromFieldPath: spec.serviceAccountNamespace
              - fromFieldPath: spec.serviceAccountName
            strategy: string
            string:
              fmt: "system:serviceaccount:%s:%s"
          toFieldPath: spec.forProvider.subject
        # Wait for UAI to be provisioned before creating FIC
        - type: FromCompositeFieldPath
          fromFieldPath: status.userAssignedIdentityId
          toFieldPath: spec.forProvider.parentId
          policy:
            fromFieldPath: Required
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: metadata.annotations["crossplane.io/external-name"]
          transforms:
            - type: string
              string:
                type: Format
                fmt: "fic-%s"

    - name: role-assignment
      base:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: RoleAssignment
        spec:
          forProvider:
            roleDefinitionName: Contributor
            principalType: ServicePrincipal
            scope: ""
            principalId: ""
          providerConfigRef:
            name: default-azure
      patches:
        - type: CombineFromComposite
          combine:
            variables:
              - fromFieldPath: spec.subscriptionId
              - fromFieldPath: spec.resourceGroupName
            strategy: string
            string:
              fmt: "/subscriptions/%s/resourceGroups/%s"
          toFieldPath: spec.forProvider.scope
        # Wait for UAI principal ID before creating role assignment
        - type: FromCompositeFieldPath
          fromFieldPath: status.principalId
          toFieldPath: spec.forProvider.principalId
          policy:
            fromFieldPath: Required
