# Promtail config for K3s homelab
# Collects logs from all pods and sends toLoki

daemonset:
  enabled: true

config:
  clients:
    - url: http://loki.loki.svc.cluster.local:3100/loki/api/v1/push

  positions:
    filename: /tmp/positions.yaml

  snippets:
    scrapeConfigs:
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Drop pods that are not running
          - source_labels:
              - __meta_kubernetes_pod_phase
            regex: Pending|Succeeded|Failed|Completed
            action: drop
          # Add namespace label
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          # Add pod name label
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          # Add container name label
          - source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: container
          # ADD node name label
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node
          # Set the log path
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

#Run on all nodes
tolerations:
- effect: NoSchedule
  operator: Exists
