deployment:
  kong:
    enabled: true

# Ingress Controller Configuration
ingressController:
  enabled: true
  installCRDs: true

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Kong Gateway/Proxy Configuration
proxy:
  type: LoadBalancer

  # HTTP and HTTPS ports
  http:
    enabled: true
    servicePort: 80
    containerPort: 8000

  tls:
    enabled: true
    servicePort: 443
    containerPort: 8443

  # Minimal resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Admin API (for debugging and management)
admin:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8001
    containerPort: 8001

# Enterprise features (disabled for OSS)
enterprise:
  enabled: false

# Environment variables for Kong
env:
  database: "off"

  # Logging
  log_level: info

  # Trust K3s internal IPs
  trusted_ips: "0.0.0.0/0,::/0"

replicaCount: 1

# Service Account
serviceAccount:
  create: true
  name: kong

# Container-level resource definitions (REQUIRED by Gatekeeper)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Autoscaling (disabled for homelab)
autoscaling:
  enabled: false

# Pod Security Context
securityContext: {}

# Container Security Context
containerSecurityContext:
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  runAsUser: 1000
  runAsNonRoot: true

# Update strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Init containers resources (if any)
migrations:
  enabled: false  # Not needed in DB-less mode